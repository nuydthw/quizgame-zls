<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Master ⚡</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/spotify/default.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b14;--surface:#0d1220;--card:#111827;--card2:#161f30;
  --border:#1e2d45;--border2:#2a3f5f;
  --violet:#7c3aed;--cyan:#06b6d4;--emerald:#10b981;
  --amber:#f59e0b;--rose:#ef4444;--pink:#ec4899;
  --text:#e8f0fe;--muted:#64748b;--subtle:#374151;
  --gv:rgba(124,58,237,.5);--gc:rgba(6,182,212,.4);--ge:rgba(16,185,129,.4);
  --gar:rgba(239,68,68,.4);
  --r:16px;--r2:12px;--r3:8px;
  --trans:.22s cubic-bezier(.4,0,.2,1);
  --font:'Be Vietnam Pro',sans-serif;
}
.light{
  --bg:#f0f4ff;--surface:#e4eaf8;--card:#fff;--card2:#f8faff;
  --border:#cbd5e1;--border2:#94a3b8;
  --text:#0f172a;--muted:#64748b;--subtle:#e2e8f0;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden;font-size:15px;line-height:1.6}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}

/* ── SCREENS ── */
.screen{width:100%;max-width:580px;animation:screenIn .45s cubic-bezier(.4,0,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.screen-out{animation:screenOut .25s ease forwards!important}
@keyframes screenOut{to{opacity:0;transform:translateY(-16px)}}

/* ── GLASS ── */
.glass{background:rgba(13,18,32,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--r)}
.light .glass{background:rgba(255,255,255,.88)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:var(--r2);border:none;cursor:pointer;font-family:var(--font);font-weight:600;font-size:14px;transition:var(--trans);position:relative;overflow:hidden;white-space:nowrap}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.06);opacity:0;transition:opacity .18s;border-radius:inherit}
.btn:hover::after{opacity:1}
.btn:active{transform:scale(.96)!important}
.btn-violet{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;box-shadow:0 4px 18px var(--gv)}
.btn-violet:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--gv)}
.btn-cyan{background:linear-gradient(135deg,#06b6d4,#0284c7);color:#fff;box-shadow:0 4px 18px var(--gc)}
.btn-cyan:hover{transform:translateY(-2px)}
.btn-emerald{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 18px var(--ge)}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border2)}
.btn-ghost:hover{border-color:var(--violet);background:rgba(124,58,237,.07)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
.btn-amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:var(--r3)}
.btn-xs{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-icon{padding:9px;width:38px;height:38px;border-radius:var(--r3);flex-shrink:0}
.btn-full{width:100%;padding:13px}
.btn:disabled{opacity:.4;pointer-events:none}

/* ── INPUTS ── */
.inp{width:100%;padding:10px 14px;border-radius:var(--r3);border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s}
.light .inp{background:rgba(255,255,255,.85)}
.inp:focus{border-color:var(--violet)}
.inp::placeholder{color:var(--muted)}
select.inp option{background:var(--surface);color:var(--text)}
label.lbl{font-size:13px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}

/* ── ANSWER OPTIONS ── */
.opt{width:100%;padding:13px 16px;border-radius:var(--r2);border:1.5px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;text-align:left;font-family:var(--font);font-size:14px;font-weight:500;color:var(--text);transition:all .2s;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.light .opt{background:rgba(255,255,255,.7)}
.opt:hover:not(.opt-disabled){border-color:var(--violet);background:rgba(124,58,237,.07);transform:translateX(4px)}
.opt.opt-correct{border-color:var(--emerald)!important;background:rgba(16,185,129,.12)!important;box-shadow:0 0 18px var(--ge);animation:correctPop .4s cubic-bezier(.34,1.56,.64,1)}
.opt.opt-wrong{border-color:var(--rose)!important;background:rgba(239,68,68,.12)!important;animation:shake .38s ease}
.opt.opt-reveal{border-color:var(--emerald)!important;background:rgba(16,185,129,.06)!important}
.opt.opt-elim{opacity:.25;pointer-events:none;text-decoration:line-through}
.opt.opt-disabled{pointer-events:none}
.opt-key{min-width:30px;height:30px;border-radius:7px;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;transition:all .2s;flex-shrink:0}
.opt-correct .opt-key{background:var(--emerald);color:#fff}
.opt-wrong .opt-key{background:var(--rose);color:#fff}
@keyframes correctPop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ── PROGRESS BAR ── */
.pbar{height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:99px;transition:width .55s cubic-bezier(.4,0,.2,1)}

/* ── TIMER CIRCLE ── */
.timer-wrap{position:relative;width:62px;height:62px;flex-shrink:0}
.timer-svg{transform:rotate(-90deg)}
.timer-bg{fill:none;stroke:var(--border);stroke-width:5}
.timer-fg{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:700;font-size:17px}

/* ── STREAK ── */
.streak{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px;transition:all .3s;border:1px solid transparent}
.streak-0{color:var(--muted);border-color:var(--border)}
.streak-1{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.streak-2{color:#f97316;border-color:rgba(249,115,22,.5);background:rgba(249,115,22,.1);animation:gpulse 1.6s infinite}
.streak-3{color:#ef4444;border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1);animation:gpulse .9s infinite}
@keyframes gpulse{0%,100%{box-shadow:0 0 12px rgba(239,68,68,.25)}50%{box-shadow:0 0 24px rgba(239,68,68,.55)}}

/* ── FREEZE ── */
.freeze-overlay{position:absolute;inset:0;border-radius:var(--r);background:rgba(6,182,212,.04);border:2px solid rgba(6,182,212,.35);pointer-events:none;animation:fpulse 2s ease infinite;z-index:5}
@keyframes fpulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── CONFETTI ── */
.conf{position:fixed;pointer-events:none;z-index:999;top:-14px;border-radius:2px;animation:confFall linear forwards}
@keyframes confFall{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}100%{transform:translateY(110vh) rotate(720deg) scale(.5);opacity:0}}

/* ── SCORE RING ── */
.score-ring{position:relative;width:110px;height:110px;margin:0 auto}
.score-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* ── MISC ── */
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.divider{height:1px;background:var(--border);width:100%}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tag-mcq{background:rgba(124,58,237,.2);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}
.tag-tf{background:rgba(6,182,212,.2);color:#67e8f9;border:1px solid rgba(6,182,212,.3)}
.tag-tnl{background:rgba(16,185,129,.2);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}

/* ── SHORT ANSWER INPUT ── */
.sa-wrap{position:relative;margin-top:4px}
.sa-inp{width:100%;padding:14px 50px 14px 16px;border-radius:var(--r2);border:2px solid var(--border2);background:rgba(255,255,255,.05);color:var(--text);font-family:var(--font);font-size:15px;font-weight:500;outline:none;transition:border-color .2s,box-shadow .2s;resize:none;min-height:52px}
.light .sa-inp{background:rgba(255,255,255,.85)}
.sa-inp:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.sa-inp::placeholder{color:var(--muted)}
.sa-inp.sa-correct{border-color:var(--emerald)!important;background:rgba(16,185,129,.1)!important;box-shadow:0 0 16px var(--ge)}
.sa-inp.sa-wrong{border-color:var(--rose)!important;background:rgba(239,68,68,.1)!important;animation:shake .38s ease}
.sa-send{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,#7c3aed,#5b21b6);border:none;border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--trans);font-size:16px}
.sa-send:hover{transform:translateY(-50%) scale(1.08);box-shadow:0 4px 14px var(--gv)}
.sa-send:disabled{opacity:.3;pointer-events:none}
.sa-result-box{margin-top:10px;padding:12px 14px;border-radius:var(--r3);font-size:14px;font-weight:600}
.sa-result-ok{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4);color:#6ee7b7}
.sa-result-bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.sa-img-label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--muted);padding:5px 10px;border-radius:6px;border:1.5px dashed var(--border2);transition:var(--trans)}
.sa-img-label:hover{border-color:var(--cyan);color:var(--cyan)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(124,58,237,.12);color:#a78bfa;border:1px solid rgba(124,58,237,.25)}
.fade-row{animation:fadeRow .32s ease forwards}
@keyframes fadeRow{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

/* ── Q TRANSITION ── */
.q-new{animation:qNew .35s cubic-bezier(.4,0,.2,1)}
@keyframes qNew{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}

/* ── RESULT ITEMS ── */
.res-item{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-radius:var(--r3);border:1px solid var(--border)}
.res-ok{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.06)}
.res-bad{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.06)}
.res-skip{border-color:var(--border);opacity:.6}

/* ── HINT BUBBLE ── */
.hint-box{padding:10px 14px;border-radius:var(--r3);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);font-size:13px;color:#fbbf24;animation:fadeRow .28s ease}

/* ── TOGGLE ── */
.toggle{display:flex;background:var(--border);border-radius:var(--r3);padding:3px;gap:3px}
.toggle .topt{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:var(--trans);color:var(--muted)}
.toggle .topt.active{background:var(--violet);color:#fff;box-shadow:0 2px 8px var(--gv)}

/* ── UPLOAD ZONE ── */
.upload-zone{border:2px dashed var(--border);border-radius:var(--r2);padding:22px;text-align:center;cursor:pointer;transition:var(--trans);position:relative}
.upload-zone:hover{border-color:var(--cyan);background:rgba(6,182,212,.04)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;width:100%;max-width:460px;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

/* ── PRACTICE BADGE ── */
.practice-q{padding:12px 14px;border-radius:var(--r3);border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.07);margin-bottom:8px}

/* ── LOGO ── */
.logo-text{font-size:38px;font-weight:800;background:linear-gradient(135deg,#a78bfa 0%,#67e8f9 55%,#6ee7b7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}

/* ── SECTION HEADER ── */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  #app{padding:8px}
  .opt{padding:11px 13px;font-size:13px}
  .glass{border-radius:var(--r2)}
  .logo-text{font-size:30px}
}

/* ── STAT CARD ── */
.stat-card{border-radius:var(--r2);padding:14px;text-align:center}
.stat-num{font-size:26px;font-weight:800;font-family:var(--font)}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:2px}

/* ── IMAGE LIGHTBOX ── */
.img-zoomable{cursor:zoom-in;transition:opacity .18s,transform .18s;border-radius:var(--r3)}
.img-zoomable:hover{opacity:.88;transform:scale(1.02)}
.lightbox-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;cursor:zoom-out}
.lightbox-inner{position:relative;max-width:min(92vw,900px);max-height:92vh;animation:popIn .28s cubic-bezier(.34,1.56,.64,1)}
.lightbox-img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:var(--r);box-shadow:0 24px 80px rgba(0,0,0,.7);display:block}
.lightbox-close{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;background:var(--rose);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(239,68,68,.5);transition:transform .15s}
.lightbox-close:hover{transform:scale(1.12)}
.lightbox-zoom-bar{position:absolute;bottom:-44px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(13,18,32,.85);border:1px solid var(--border);border-radius:99px;padding:6px 14px}
.lightbox-zoom-bar button{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:6px;transition:background .15s}
.lightbox-zoom-bar button:hover{background:rgba(255,255,255,.1)}
.lightbox-zoom-lbl{font-size:13px;font-weight:700;color:var(--muted);min-width:38px;text-align:center}

/* ── RICH TEXT display (bold/italic/newline in questions) ── */
.rich-text strong{font-weight:800;color:var(--text)}
.rich-text em{font-style:italic;color:#c4b5fd}
.rich-text br{display:block;content:'';margin-top:4px}

/* ── RICH TEXT EDITOR (create screen) ── */
.rte-wrap{position:relative;margin-bottom:9px}
.rte-toolbar{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;align-items:center}
.rte-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border-radius:6px;border:1.5px solid var(--border2);background:transparent;color:var(--text);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;padding:0}
.rte-btn:hover{background:rgba(124,58,237,.15);border-color:var(--violet);color:#a78bfa}
.rte-btn.active{background:rgba(124,58,237,.25);border-color:var(--violet);color:#a78bfa}
.rte-btn-b{font-weight:900}
.rte-btn-i{font-style:italic;font-weight:600}
.rte-hint{font-size:11px;color:var(--muted);padding:2px 7px;border-left:2px solid var(--border2)}
.rte-field{width:100%;min-height:44px;padding:10px 14px;border-radius:var(--r3);border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s;line-height:1.7;cursor:text;white-space:pre-wrap;word-break:break-word}
.light .rte-field{background:rgba(255,255,255,.85)}
.rte-field:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.rte-field[placeholder]:empty::before{content:attr(placeholder);color:var(--muted);pointer-events:none}
.rte-field strong{font-weight:800;color:var(--text)}
.rte-field em{font-style:italic;color:#c4b5fd}
.rte-preview{margin-top:5px;padding:7px 11px;border-radius:6px;background:rgba(124,58,237,.06);border:1px solid rgba(124,58,237,.2);font-size:13px;color:var(--muted);display:none}
.rte-preview.has-fmt{display:block}
.rte-preview-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--violet);margin-bottom:3px}

/* ── CURSOR EFFECTS ── */
#cursor-dot{pointer-events:none;position:fixed;z-index:9999;width:7px;height:7px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);will-change:left,top;mix-blend-mode:difference;transition:width .15s,height .15s,opacity .2s}
.cur-spark{pointer-events:none;position:fixed;transform:translate(-50%,-50%);animation:sparkFly3 var(--dur,.65s) cubic-bezier(.12,.85,.35,1) forwards;z-index:9997}
@keyframes sparkFly3{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}65%{opacity:.45}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px))) scale(0)}}
.cur-glow{pointer-events:none;position:fixed;border-radius:50%;transform:translate(-50%,-50%);animation:glowFade var(--gd,.5s) ease-out forwards;z-index:9993;filter:blur(4px)}
@keyframes glowFade{0%{opacity:.6;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
.cur-ripple{pointer-events:none;position:fixed;border-radius:50%;border:1.5px solid var(--rclr,rgba(167,139,250,.7));transform:translate(-50%,-50%) scale(0);animation:rippleOut3 .75s ease-out forwards;z-index:9993}
@keyframes rippleOut3{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(4.5);opacity:0}}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="app"></div>
<!-- Lightbox -->
<div id="lightbox" class="lightbox-bg" style="display:none" onclick="closeLightbox(event)">
  <div class="lightbox-inner" id="lb-inner">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lb-img" class="lightbox-img" src="" alt="">
    <div class="lightbox-zoom-bar">
      <button onclick="lbZoom(-0.2)">−</button>
      <span id="lb-zoom-lbl" class="lightbox-zoom-lbl">100%</span>
      <button onclick="lbZoom(+0.2)">+</button>
      <button onclick="lbZoomReset()" style="font-size:12px;color:var(--muted)">↺</button>
    </div>
  </div>
</div>
<!-- Cursor -->
<div id="cursor-dot"></div>

<script>
/* ═══════════════════════════════════════════════════════
   QUIZ MASTER — Full Single File
   ═══════════════════════════════════════════════════════ */

/* ── SOUND ENGINE ── */
const AC = window.AudioContext ? new (window.AudioContext||window.webkitAudioContext)() : null;
function tone(freq,type='sine',dur=.15,vol=.22){
  if(!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.start();o.stop(AC.currentTime+dur);}catch(e){}
}
const SFX={
  click:()=>tone(480,'sine',.07,.16),

/* ── STORAGE ENGINE ──
   In-memory store is the single source of truth.
   localStorage is best-effort persistence, split per-set to avoid quota.
   ─────────────────────────────────────────────────────────── */

/* Question Sets in-memory master list */
const _QS_MEM = { list: null };

const QS = {
  _load() {
    if (_QS_MEM.list !== null) return;
    /* Try new per-key format */
    try {
      const idxRaw = localStorage.getItem('qs_index');
      if (idxRaw) {
        const idx = JSON.parse(idxRaw);
        const list = [];
        for (const meta of idx) {
          try {
            const raw = localStorage.getItem(meta.key);
            if (raw) list.push({ name: meta.name, timePerQ: meta.timePerQ || 20, hints: meta.hints || 3, questions: JSON.parse(raw) });
          } catch (_) {}
        }
        _QS_MEM.list = list;
        return;
      }
    } catch (_) {}
    /* Fallback legacy */
    try {
      const raw = localStorage.getItem('question_sets');
      _QS_MEM.list = raw ? JSON.parse(raw) : [];
    } catch { _QS_MEM.list = []; }
  },

  getAll() { this._load(); return _QS_MEM.list; },

  _persist() {
    const list = _QS_MEM.list;
    /* Remove old per-key entries */
    try {
      const oldIdx = JSON.parse(localStorage.getItem('qs_index') || '[]');
      for (const m of oldIdx) { try { localStorage.removeItem(m.key); } catch (_) {} }
    } catch (_) {}
    const idx = [];
    for (let i = 0; i < list.length; i++) {
      const s = list[i];
      const key = 'qs_' + i;
      const meta = { name: s.name, timePerQ: s.timePerQ, hints: s.hints, key };
      try {
        localStorage.setItem(key, JSON.stringify(s.questions));
        idx.push(meta);
      } catch (_) { /* questions too large — won't persist but MEM is fine */ }
    }
    try { localStorage.setItem('qs_index', JSON.stringify(idx)); } catch (_) {}
    try { localStorage.removeItem('question_sets'); } catch (_) {}
  },

  upsert(ns) {
    this._load();
    const ei = _QS_MEM.list.findIndex(s => s.name === ns.name);
    if (ei >= 0) _QS_MEM.list[ei] = ns; else _QS_MEM.list.push(ns);
    this._persist();
  },

  remove(i) {
    this._load();
    _QS_MEM.list.splice(i, 1);
    this._persist();
  },

  update(i, ns) {
    this._load();
    _QS_MEM.list[i] = ns;
    this._persist();
  },
};

/* ── localStorage wrapper (non-question-set keys) ── */
const _LS_MEM = {};
const LS = {
  get(k, d) {
    if (k === 'question_sets') return QS.getAll();
    if (k in _LS_MEM) return _LS_MEM[k];
    try { const v = localStorage.getItem(k); const p = v != null ? JSON.parse(v) : d; _LS_MEM[k] = p; return p; }
    catch { return d; }
  },
  set(k, v) {
    if (k === 'question_sets') { QS._load(); _QS_MEM.list = v; QS._persist(); return; }
    _LS_MEM[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {}
  },
};

/* ── CANVAS BG + PARTICLE SYSTEM ── */
(function initBG(){
  const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');
  let W,H,particles=[],orbs=[];
  const resize=()=>{W=c.width=window.innerWidth;H=c.height=window.innerHeight;
    particles.forEach(p=>{if(p.x>W)p.x=Math.random()*W;if(p.y>H)p.y=Math.random()*H;});
  };
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<90;i++)particles.push({
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight,
    vx:(Math.random()-.5)*.42,
    vy:(Math.random()-.5)*.42,
    r:Math.random()*2+.6,
    a:.35+Math.random()*.65
  });
  const oc=[[124,58,237],[6,182,212],[16,185,129],[236,72,153]];
  for(let i=0;i<4;i++)orbs.push({
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight,
    vx:(Math.random()-.5)*.4,
    vy:(Math.random()-.5)*.4,
    r:180+Math.random()*140,
    col:oc[i]
  });
  function draw(){
    ctx.clearRect(0,0,W,H);
    const isDark=!document.body.classList.contains('light');
    orbs.forEach(o=>{
      o.x+=o.vx;o.y+=o.vy;
      if(o.x<-o.r)o.x=W+o.r;if(o.x>W+o.r)o.x=-o.r;
      if(o.y<-o.r)o.y=H+o.r;if(o.y>H+o.r)o.y=-o.r;
      const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      g.addColorStop(0,`rgba(${o.col.join(',')},${isDark?.11:.06})`);g.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    });
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=isDark?`rgba(180,200,255,${p.a*.55})`:`rgba(80,100,140,${p.a*.3})`;
      ctx.fill();
    });
    for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){
        const alpha=isDark?.18*(1-d/120):.1*(1-d/120);
        ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);
        ctx.strokeStyle=isDark?`rgba(140,160,220,${alpha})`:`rgba(100,120,180,${alpha})`;
        ctx.lineWidth=.7;ctx.stroke();
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ── RENDERER ── */
const $app=document.getElementById('app');
let _rAF=null;
function render(){if(_rAF)cancelAnimationFrame(_rAF);_rAF=requestAnimationFrame(_doRender);}
function _doRender(){
  document.body.className=S.darkMode?'':'light';
  // render modal on top if needed
  if(S.modal){renderModal();return;}
  switch(S.screen){
    case'menu':renderMenu();break;
    case'create':renderCreate();break;
    case'game':renderGame();break;
    case'result':renderResult();break;
    case'practice':renderPractice();break;
  }
}
function setScreen(s){
  const cur=document.querySelector('.screen');
  if(cur){cur.classList.add('screen-out');setTimeout(()=>{S.screen=s;render()},260);}
  else{S.screen=s;render();}
}

/* helper */
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* Clickable image with lightbox */
function zoomImg(src,style){
  return `<img src="${src}" class="img-zoomable" style="${style}" onclick="openLightbox(this.src)" alt="">`;
}

/* ── File Upload (JSON / TXT / PDF note / DOC hint) ── */
window.uploadFile=(e)=>{
  const f=e.target.files[0];if(!f)return;
  e.target.value='';
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='json'||ext==='txt'){
    const r=new FileReader();
    r.onload=ev=>{
      try{
        if(ext==='json'){
          let data;
          try{data=JSON.parse(ev.target.result);}catch(pe){alert('❌ File JSON không hợp lệ!\nLỗi: '+pe.message);return;}
          const qs=Array.isArray(data)?data:(data.questions||[]);
          if(!qs.length){alert('Không tìm thấy câu hỏi trong file!');return;}
          const setName=f.name.replace(/\.json$/i,'').replace(/_/g,' ');
          const ns={name:setName,questions:qs.map((q,qi)=>({...q,id:q.id||qi+1})),timePerQ:data.timePerQ||20,hints:data.hints||3};
          QS.upsert(ns);
          SFX.correct();
          alert('✔️ Đã thêm bộ đề "'+setName+'" ('+qs.length+' câu)\nvào menu chơi!');
          render();
        } else {
          const lines=ev.target.result.split('\n').filter(l=>l.trim());
          const qs=parseTXT(lines);
          if(!qs.length){alert('Không đọc được câu hỏi từ file TXT!\nĐịnh dạng: mỗi câu gồm dòng câu hỏi, 4 dòng A)... B)... C)... D)..., và dòng "Đáp án: A"');return;}
          const setName=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ');
          QS.upsert({name:setName,questions:qs,timePerQ:20,hints:3});
          SFX.correct();
          alert('✔️ Đã thêm bộ đề "'+setName+'" ('+qs.length+' câu)\nvào menu chơi!');
          render();
        }
      }catch(err){alert('Lỗi đọc file: '+err.message);}
    };
    r.onerror=()=>alert('❌ Không thể đọc file. Vui lòng thử lại.');
    r.readAsText(f,'UTF-8');
  } else if(ext==='pdf'){
    alert('📄 File PDF đã nhận!\n\nDo giới hạn trình duyệt, bạn cần copy nội dung câu hỏi từ PDF vào file JSON hoặc TXT theo định dạng mẫu.\n\nĐịnh dạng JSON mẫu:\n[{"type":"mcq","question":"...","options":["A","B","C","D"],"answer":0}]');
  } else if(ext==='doc'||ext==='docx'){
    alert('📝 File DOC/DOCX đã nhận!\n\nDo giới hạn trình duyệt thuần (không có server), bạn cần xuất file Word thành JSON hoặc TXT theo định dạng:\n\n1. Câu hỏi?\nA) Đáp án A\nB) Đáp án B\nC) Đáp án C\nD) Đáp án D\nĐáp án: A');
  }
};

function parseTXT(lines){
  const qs=[];let cur=null;
  lines.forEach(line=>{
    const l=line.trim();
    if(/^[A-D]\)/i.test(l)&&cur){
      const idx='ABCD'.indexOf(l[0].toUpperCase());
      cur.options[idx]=l.slice(2).trim();
    } else if(/^(đáp án|answer)\s*:\s*[A-D]/i.test(l)&&cur){
      cur.answer='ABCD'.indexOf(l.match(/[A-D]/i)[0].toUpperCase());
      cur.type='mcq';qs.push(cur);cur=null;
    } else if(l){
      if(cur&&cur.question)qs.push(cur);
      cur={question:l,options:['','','',''],answer:0,type:'mcq',id:qs.length+1};
    }
  });
  if(cur&&cur.question)qs.push(cur);
  return qs;
}

/* Inject rich-text editor into a slot after DOM render */
function injectRTE(i,val){
  const slot=document.getElementById('cr-q-rte-'+i);
  if(!slot)return;
  // Build toolbar + contenteditable
  const id='rte-q-'+i;
  slot.innerHTML=`
    <div class="rte-wrap">
      <div class="rte-toolbar">
        <button type="button" class="rte-btn rte-btn-b" title="In đậm (Ctrl+B)" onmousedown="rteExec(event,'${id}','bold')"><b>B</b></button>
        <button type="button" class="rte-btn rte-btn-i" title="In nghiêng (Ctrl+I)" onmousedown="rteExec(event,'${id}','italic')"><i>I</i></button>
        <button type="button" class="rte-btn" title="Xuống dòng" onmousedown="rteExec(event,'${id}','br')" style="font-size:14px">↵</button>
        <span class="rte-hint">Ctrl+B · Ctrl+I · Enter xuống dòng</span>
      </div>
      <div class="rte-field" id="${id}" contenteditable="true" placeholder="Nội dung câu hỏi..."
        data-qi="${i}"
        oninput="rteOnInput('${id}',${i})"
        onkeydown="rteOnKey(event,'${id}',${i})"
        onpaste="rtePaste(event)"
      >${rawToEditable(val||'')}</div>
      <div class="rte-preview${hasFmt(val)?' has-fmt':''}" id="${id}-prev">
        <div class="rte-preview-label">Xem trước</div>
        <span class="rich-text">${richText(val||'')}</span>
      </div>
    </div>`;
}
window.rteExec=(ev,id,cmd)=>{
  ev.preventDefault();
  const el=document.getElementById(id);
  if(!el)return;
  el.focus();
  if(cmd==='bold')document.execCommand('bold',false,null);
  else if(cmd==='italic')document.execCommand('italic',false,null);
  else if(cmd==='br')document.execCommand('insertHTML',false,'<br><br>');
  const qi=parseInt(el.getAttribute('data-qi'));
  rteFlush(id,qi);
};
window.rteOnKey=(e,id,qi)=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='b'){e.preventDefault();document.execCommand('bold',false,null);rteFlush(id,qi);}
  if((e.ctrlKey||e.metaKey)&&e.key==='i'){e.preventDefault();document.execCommand('italic',false,null);rteFlush(id,qi);}
  // Enter inserts <br> (default contenteditable behavior already handles this)
};
window.rteOnInput=(id,qi)=>{rteFlush(id,qi);};
window.rtePaste=(e)=>{
  e.preventDefault();
  const text=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,text);
};
function rteFlush(id,qi){
  const el=document.getElementById(id);
  if(!el)return;
  const raw=editableToRaw(el.innerHTML);
  CR.questions[qi].question=raw;
  // update preview
  const prev=document.getElementById(id+'-prev');
  if(prev){
    const span=prev.querySelector('.rich-text');
    if(span)span.innerHTML=richText(raw);
    prev.className='rte-preview'+(hasFmt(raw)?' has-fmt':'');
  }
}

  const valid=CR.questions.filter(q=>q.question.trim());
  if(!valid.length){alert('Nhập ít nhất 1 câu hỏi!');return;}
  const ns={name:CR.name||'Bộ đề',questions:valid.map((q,i)=>({...q,id:i+1})),timePerQ:CR.timePerQ||20,hints:CR.hints||3};
  if(CR.editIndex!=null){
    // Editing existing — overwrite
    QS.update(CR.editIndex, ns);
    SFX.correct();
    // Auto export JSON
    _doExportJSON(ns);
    // Go to game
    startGame(ns.questions,{timePerQ:ns.timePerQ,hints:ns.hints,name:ns.name});
  } else {
    // New set — push, export JSON, reset CR, go to game
    QS.upsert(ns);
    SFX.correct();
    // Auto export JSON
    _doExportJSON(ns);
    // Reset so next time user creates fresh
    initCR();
    startGame(ns.questions,{timePerQ:ns.timePerQ,hints:ns.hints,name:ns.name});
  }
};

function _doExportJSON(ns){
  const blob=new Blob([JSON.stringify(ns,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(ns.name||'bode').replace(/\s+/g,'_')+'.json';
  a.click();URL.revokeObjectURL(a.href);
}

    selected:null,eliminated:[],hintsLeft:config.hints,

/* ── Game Logic ── */
function startTimer(){
  clearInterval(S.timerID);
  S.timerID=setInterval(()=>{
    if(S.answered||S.frozen)return;
    if(S.timeLeft<=3&&S.timeLeft>0)SFX.tick();
    S.timeLeft--;
    if(S.timeLeft<=0){clearInterval(S.timerID);onTimeout();}
    else updateTimerDOM();
  },1000);
}
function updateTimerDOM(){
  const t=S.timeLeft,tot=S.config.timePerQ;
  const pct=t/tot,R=26,CIRC=2*Math.PI*R;
  const col=pct>.5?'#10b981':pct>.25?'#f59e0b':'#ef4444';
  const n=document.querySelector('.timer-num'),fg=document.querySelector('.timer-fg');
  if(n){n.textContent=t;n.style.color=col;}
  if(fg){fg.style.stroke=col;fg.setAttribute('stroke-dashoffset',(CIRC*(1-pct)).toFixed(2));}
}
function onTimeout(){
  if(S.answered)return;
  S.answered=true;S.selected=-1;S.streak=0;SFX.wrong();
  const q=S.questions[S.idx];
  let answerDisplay;
  if(q.type==='tnl') answerDisplay=String(q.answer);
  else if(q.type==='tf'&&q.subQuestions) answerDisplay='Hết giờ';
  else answerDisplay=(q.options?q.options[q.answer]:'');
  S.results.push({q:q.question,correct:false,timed:true,answer:answerDisplay,obj:q});
  renderGame();setTimeout(advance,1800);
}
window.selectOpt=(oi)=>{
  if(S.answered||S.frozen||S.eliminated.includes(oi))return;
  clearInterval(S.timerID);S.selected=oi;S.answered=true;
  const q=S.questions[S.idx],ok=oi===q.answer;
  if(ok){
    SFX.correct();S.score++;S.streak++;
    if(S.streak>S.bestStreak){S.bestStreak=S.streak;LS.set('best_streak',S.streak);}
    if(S.streak>=3)SFX.streak();
  }else{
    SFX.wrong();S.streak=0;
    // add to practice list
    if(!S.practiceList.find(p=>p.id===q.id))S.practiceList.push(q);
  }
  S.results.push({q:q.question,correct:ok,skipped:false,answer:q.options[q.answer],obj:q});
  renderGame();setTimeout(advance,ok?1200:1800);
};

/* ── TNL: Short Answer ── */
window.submitSA=()=>{
  if(S.answered||S.frozen)return;
  const field=document.getElementById('sa-field');
  const input=(field?field.value:S.saInput).trim();
  if(!input){if(field){field.style.borderColor='var(--rose)';setTimeout(()=>{field.style.borderColor='';},600);}return;}
  clearInterval(S.timerID);
  const q=S.questions[S.idx];
  const normalize=s=>String(s).toLowerCase().trim().replace(/\s+/g,' ');
  const userNorm=normalize(input);
  const ansNorm=normalize(q.answer);
  const altNorm=q.answerAlt?normalize(q.answerAlt):'';
  const ok=userNorm===ansNorm||(altNorm&&userNorm===altNorm);
  S.saInput=input;S.saCorrect=ok;S.answered=true;
  if(ok){
    SFX.correct();S.score++;S.streak++;
    if(S.streak>S.bestStreak){S.bestStreak=S.streak;LS.set('best_streak',S.streak);}
    if(S.streak>=3)SFX.streak();
  }else{
    SFX.wrong();S.streak=0;
    if(!S.practiceList.find(p=>p.id===q.id))S.practiceList.push(q);
  }
  S.results.push({q:q.question,correct:ok,skipped:false,answer:String(q.answer),userAnswer:input,obj:q});
  renderGame();setTimeout(advance,ok?1400:2200);
};
window.setSAImg=(e)=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{S.saImg=ev.target.result;renderGame();setTimeout(()=>{const tf=document.getElementById('sa-field');if(tf)tf.focus();},50);};
  r.readAsDataURL(f);e.target.value='';
};
window.gameFreeze=()=>{if(S.answered)return;SFX.click();clearInterval(S.timerID);S.frozen=true;renderGame();};
window.gameResume=()=>{SFX.click();S.frozen=false;renderGame();startTimer();};
window.gameSkip=()=>{
  if(S.answered||S.frozen)return;
  SFX.click();clearInterval(S.timerID);
  const q=S.questions[S.idx];
  let answerDisplay;
  if(q.type==='tnl') answerDisplay=String(q.answer);
  else if(q.type==='tf'&&q.subQuestions) answerDisplay='Bỏ qua';
  else answerDisplay=(q.options?q.options[q.answer]:'');
  S.results.push({q:q.question,correct:false,skipped:true,answer:answerDisplay,obj:q});
  S.streak=0;
  if(!S.practiceList.find(p=>p.id===q.id))S.practiceList.push(q);
  advance();
};
window.gameHint=()=>{
  if(S.hintsLeft<=0||S.answered||S.frozen)return;
  SFX.click();
  const q=S.questions[S.idx];
  if(q.hint&&!S.currentHint){S.currentHint=q.hint;S.hintsLeft--;renderGame();startTimer();return;}
  if(q.type==='tnl'){
    // For TNL: reveal first character as hint
    const ans=String(q.answer);
    S.currentHint='Chữ cái đầu tiên: "'+ans[0].toUpperCase()+'" · Độ dài: '+ans.length+' ký tự';
    S.hintsLeft--;renderGame();startTimer();return;
  }
  const wrongs=q.options.map((_,i)=>i).filter(i=>i!==q.answer&&!S.eliminated.includes(i));
  const toEl=wrongs.slice(0,Math.min(2,Math.max(1,wrongs.length-1)));
  if(toEl.length){S.eliminated.push(...toEl);S.hintsLeft--;renderGame();startTimer();}
};
window.gameEnd=()=>{
  if(!confirm('Kết thúc game?'))return;
  clearInterval(S.timerID);S.elapsed=Math.floor((Date.now()-S.startTime)/1000);setScreen('result');
};
function advance(){
  clearInterval(S.timerID);S.currentHint='';
  if(S.idx+1>=S.questions.length){S.elapsed=Math.floor((Date.now()-S.startTime)/1000);setScreen('result');return;}
  S.idx++;S.timeLeft=S.config.timePerQ;S.answered=false;S.selected=null;S.eliminated=[];S.frozen=false;
  S.saInput='';S.saImg='';S.saCorrect=false;S.tfSubAnswers=[];
  renderGame();SFX.whoosh();
}

/* ── Đ/S sub-question game logic ── */
window.tfSelectSub=(si,val)=>{
  if(S.answered||S.frozen)return;
  if(!S.tfSubAnswers)S.tfSubAnswers=[];
  S.tfSubAnswers[si]=val;
  renderGame();
  // Re-focus timer (don't restart)
  const fg=document.querySelector('.timer-fg');
  if(fg){/* keep running */}
};
window.tfSubmit=()=>{
  if(S.answered||S.frozen)return;
  clearInterval(S.timerID);
  const q=S.questions[S.idx];
  const subs=q.subQuestions||[];
  const answers=q.subAnswers||[];
  const playerAnss=S.tfSubAnswers||[];
  // Count only sub-questions that have content AND have a defined answer
  const validSubs=subs.map((s,i)=>({s,i})).filter(({s,i})=>s.text&&answers[i]!==null&&answers[i]!==undefined);
  if(!validSubs.length){advance();return;}
  let correct=0;
  validSubs.forEach(({i})=>{
    if(playerAnss[i]===answers[i])correct++;
  });
  const allCorrect=correct===validSubs.length;
  if(allCorrect){
    SFX.correct();S.score++;S.streak++;
    if(S.streak>S.bestStreak){S.bestStreak=S.streak;LS.set('best_streak',S.streak);}
    if(S.streak>=3)SFX.streak();
  }else{
    SFX.wrong();S.streak=0;
    if(!S.practiceList.find(p=>p.id===q.id))S.practiceList.push(q);
  }
  S.answered=true;
  S.results.push({q:q.question,correct:allCorrect,skipped:false,answer:`${correct}/${validSubs.length} đúng`,obj:q});
  renderGame();
  setTimeout(advance,allCorrect?1400:2400);
};

  $app.innerHTML=`

      <h2 style="font-size:22px;font-weight:700;margin-bottom:4px">Kết quả</h2>

      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px">
        <div class="stat-card" style="background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.22)">
          <div class="stat-num" style="color:#10b981">${S.score}</div>
          <div class="stat-lbl">Câu đúng</div>
        </div>
        <div class="stat-card" style="background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.22)">
          <div class="stat-num" style="color:#a78bfa">${S.bestStreak}</div>
          <div class="stat-lbl">🔥 Chuỗi max</div>

window.playAgain=()=>{SFX.click();startGame(S.questions,S.config);};

/* ══════════════════════════════════════════════════
   PRACTICE SCREEN (Luyện tập câu sai)
══════════════════════════════════════════════════ */
let PR={idx:0,score:0,answered:false,selected:null,saInput:'',saCorrect:false,results:[]};
function renderPractice(){
  if(!S.practiceList||!S.practiceList.length){setScreen('menu');return;}
  const q=S.practiceList[PR.idx],total=S.practiceList.length,done=PR.answered;
  $app.innerHTML=`
  <div class="screen" style="max-width:580px;width:100%">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button class="btn btn-ghost btn-icon" onclick="backFromPractice()">←</button>
      <div>
        <h2 style="font-size:18px;font-weight:700">📝 Luyện tập</h2>
        <p style="font-size:12px;color:var(--muted)">Ôn lại các câu đã sai / bỏ qua</p>
      </div>
      <div style="margin-left:auto;font-size:13px;font-weight:600;color:var(--muted)">
        ${PR.idx+1} / ${total}
      </div>
    </div>

    <!-- Progress -->
    <div class="pbar" style="margin-bottom:16px"><div class="pfill" style="width:${Math.round((PR.idx/total)*100)}%"></div></div>

    <!-- Card -->
    <div class="glass" style="padding:20px;margin-bottom:12px">
      <div style="display:flex;gap:7px;margin-bottom:12px">
        <span class="tag tag-${q.type==='tnl'?'tnl':q.type==='mcq'?'mcq':'tf'}">${q.type==='tnl'?'Trả lời ngắn':q.type==='mcq'?'ABCD':'4 Lựa chọn'}</span>
        <span class="tag" style="background:rgba(245,158,11,.14);color:#fbbf24;border:1px solid rgba(245,158,11,.3)">Câu sai / bỏ qua</span>
      </div>
      <p class="rich-text" style="font-size:16px;font-weight:600;line-height:1.55;margin-bottom:16px">${richText(q.question)}</p>
      ${q.image?zoomImg(q.image,'max-width:100%;max-height:160px;margin-bottom:13px;object-fit:contain;border:1px solid var(--border)'):''}
      ${q.hint?`<div class="hint-box" style="margin-bottom:13px">💡 ${esc(q.hint)}</div>`:''}
      ${q.type==='tnl'?`
        <div>
          ${done?`
            <div class="sa-result-box ${PR.saCorrect?'sa-result-ok':'sa-result-bad'}">
              ${PR.saCorrect?'✅ Chính xác!':'❌ Sai. Đáp án đúng: <strong>'+esc(String(q.answer))+'</strong>'}
            </div>
            ${PR.saInput?`<div style="margin-top:7px;font-size:13px;color:var(--muted)">Bạn nhập: <em style="color:var(--text)">${esc(PR.saInput)}</em></div>`:''}
          `:`
            <div class="sa-wrap">
              <textarea id="pr-sa-field" class="sa-inp" rows="2" placeholder="Nhập câu trả lời..."
                autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();prSubmitSA()}"
              ></textarea>
              <button class="sa-send" onclick="prSubmitSA()">↵</button>
            </div>
          `}
        </div>
      `:`
        <div style="display:flex;flex-direction:column;gap:8px">
          ${(q.options||[]).map((opt,oi)=>{
            let cls='opt';
            if(done){
              cls+=' opt-disabled';
              if(oi===q.answer)cls+=' opt-reveal';
              if(oi===PR.selected&&PR.selected!==q.answer)cls+=' opt-wrong';
              if(oi===PR.selected&&PR.selected===q.answer)cls+=' opt-correct';
            }
            return`<button class="${cls}" onclick="prSelect(${oi})">
              <div class="opt-key">${String.fromCharCode(65+oi)}</div>
              <span class="rich-text" style="flex:1">${richText(opt)}${q.optImages&&q.optImages[oi]?zoomImg(q.optImages[oi],'display:block;max-width:100%;max-height:80px;margin-top:5px;object-fit:contain'):''}</span>
              ${done&&oi===q.answer?'<span style="font-size:17px">✓</span>':''}
              ${done&&oi===PR.selected&&PR.selected!==q.answer?'<span style="font-size:17px">✗</span>':''}
            </button>`;
          }).join('')}
        </div>
      `}
    </div>

    <!-- Score bar -->
    <div class="glass" style="padding:13px 16px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:14px;font-weight:600;color:var(--emerald)">✓ ${PR.score} đúng</span>
      <span style="font-size:13px;color:var(--muted)">${total - PR.idx - 1} câu còn lại</span>
    </div>
  </div>`;
}

window.prSubmitSA=()=>{
  if(PR.answered)return;
  const field=document.getElementById('pr-sa-field');
  const input=(field?field.value:'').trim();
  if(!input){if(field){field.style.borderColor='var(--rose)';setTimeout(()=>{field.style.borderColor='';},600);}return;}
  PR.answered=true;
  const q=S.practiceList[PR.idx];
  const normalize=s=>String(s).toLowerCase().trim().replace(/\s+/g,' ');
  const ok=normalize(input)===normalize(q.answer)||(q.answerAlt&&normalize(input)===normalize(q.answerAlt));
  PR.saInput=input;PR.saCorrect=ok;
  if(ok){SFX.correct();PR.score++;}else{SFX.wrong();}
  PR.results.push({q:q.question,correct:ok,answer:String(q.answer)});
  renderPractice();
  setTimeout(()=>{
    if(PR.idx+1>=S.practiceList.length){showPracticeResult();return;}
    PR.idx++;PR.answered=false;PR.selected=null;PR.saInput='';PR.saCorrect=false;renderPractice();SFX.whoosh();
  },ok?1400:2200);
};
window.prSelect=(oi)=>{
  if(PR.answered)return;
  PR.answered=true;PR.selected=oi;
  const q=S.practiceList[PR.idx],ok=oi===q.answer;
  if(ok){SFX.correct();PR.score++;}else{SFX.wrong();}
  PR.results.push({q:q.question,correct:ok,answer:q.options?q.options[q.answer]:''});
  renderPractice();
  setTimeout(()=>{
    if(PR.idx+1>=S.practiceList.length){showPracticeResult();return;}
    PR.idx++;PR.answered=false;PR.selected=null;PR.saInput='';PR.saCorrect=false;renderPractice();SFX.whoosh();
  },ok?1200:1800);
};
window.backFromPractice=()=>{
  PR={idx:0,score:0,answered:false,selected:null,saInput:'',saCorrect:false,results:[]};
  SFX.click();setScreen('result');
};
function showPracticeResult(){
  const total=S.practiceList.length,pct=Math.round((PR.score/total)*100);
  if(pct>=80)setTimeout(()=>{launchConfetti();SFX.end();},200);
  const fc=pct>=80?'#10b981':pct>=50?'#f59e0b':'#ef4444';
  $app.innerHTML=`
  <div class="screen" style="max-width:480px;width:100%">
    <div class="glass" style="padding:26px;text-align:center">
      <div style="font-size:44px;margin-bottom:10px">${pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':'💪'}</div>
      <h2 style="font-size:20px;font-weight:700;margin-bottom:4px">Kết quả luyện tập</h2>
      <p style="font-size:28px;font-weight:800;color:${fc};margin:14px 0">${PR.score} / ${total}</p>
      <p style="font-size:15px;font-weight:600;color:var(--muted);margin-bottom:20px">${pct}% chính xác</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${pct<100?`<button class="btn btn-violet btn-full" onclick="retryPractice()">🔁 Ôn lại câu sai</button>`:''}
        <button class="btn btn-ghost btn-full" onclick="backFromPractice()">← Về kết quả</button>
        <button class="btn btn-ghost btn-full" onclick="goMenuFromResult()">🏠 Menu chính</button>
      </div>
    </div>
  </div>`;
}
window.retryPractice=()=>{
  S.practiceList=PR.results.filter(r=>!r.correct).map((r,i)=>S.practiceList.find(q=>q.question===r.q)||{question:r.q,id:i});
  if(!S.practiceList.length){alert('Bạn đã trả lời đúng tất cả! 🎉');backFromPractice();return;}
  PR={idx:0,score:0,answered:false,selected:null,saInput:'',saCorrect:false,results:[]};SFX.click();setScreen('practice');
};

/* ── Confetti ── */
function launchConfetti(){
  const cols=['#7c3aed','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#a78bfa','#67e8f9'];
  for(let i=0;i<65;i++){
    const el=document.createElement('div');el.className='conf';
    el.style.cssText=`left:${Math.random()*100}%;width:${6+Math.random()*9}px;height:${6+Math.random()*9}px;background:${cols[i%cols.length]};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${2+Math.random()*2.2}s;animation-delay:${Math.random()*1.8}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),(4.5+Math.random()*2)*1000);
  }
}

PR={idx:0,score:0,answered:false,selected:null,saInput:'',saCorrect:false,results:[]};

let _lbZoom=1;
window.openLightbox=(src)=>{
  _lbZoom=1;
  const lb=document.getElementById('lightbox');
  const img=document.getElementById('lb-img');
  const lbl=document.getElementById('lb-zoom-lbl');
  img.src=src;
  img.style.transform='scale(1)';
  if(lbl)lbl.textContent='100%';
  lb.style.display='flex';
  document.body.style.overflow='hidden';
};
window.closeLightbox=(e)=>{
  if(e&&e.target!==document.getElementById('lightbox')&&!e.target.classList.contains('lightbox-close'))return;
  document.getElementById('lightbox').style.display='none';
  document.body.style.overflow='';
};
window.lbZoom=(delta)=>{
  _lbZoom=Math.max(.2,Math.min(4,_lbZoom+delta));
  const img=document.getElementById('lb-img');
  const lbl=document.getElementById('lb-zoom-lbl');
  if(img)img.style.transform=`scale(${_lbZoom})`;
  if(lbl)lbl.textContent=Math.round(_lbZoom*100)+'%';
};
window.lbZoomReset=()=>{_lbZoom=1;lbZoom(0);};
// Keyboard: Esc to close, +/- to zoom
document.addEventListener('keydown',(e)=>{
  const lb=document.getElementById('lightbox');
  if(!lb||lb.style.display==='none')return;
  if(e.key==='Escape'){lb.style.display='none';document.body.style.overflow='';}
  if(e.key==='+'||e.key==='=')lbZoom(.2);
  if(e.key==='-')lbZoom(-.2);
});
// Mouse wheel zoom
document.getElementById('lightbox').addEventListener('wheel',(e)=>{
  e.preventDefault();
  lbZoom(e.deltaY<0?.15:-.15);
},{passive:false});

/* ══════════════════════════════════════════════════
   RICH TEXT EDITOR HELPERS
══════════════════════════════════════════════════ */

/* Convert stored raw text (with **bold** *italic* \n) → HTML for display */
function richText(s){
  if(s==null)return'';
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*\n]+?)\*/g,'<em>$1</em>')
    .replace(/\\n|\n/g,'<br>');
}

/* Convert stored raw text → innerHTML for contenteditable */
function rawToEditable(s){
  if(!s)return'';
  // Escape HTML but keep structure
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*\n]+?)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');
}

/* Convert contenteditable innerHTML → raw storage format */
function editableToRaw(html){
  // Normalize: <br> → \n, <strong> → **, <em> → *, strip other tags
  return html
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<strong>([\s\S]*?)<\/strong>/gi,'**$1**')
    .replace(/<em>([\s\S]*?)<\/em>/gi,'*$1*')
    .replace(/<[^>]+>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ');
}

/* Has any formatting tokens? */
function hasFmt(s){return s&&(/\*\*|^\*[^*]/.test(s)||s.includes('\n'));}

/* ══════════════════════════════════════════════════
   CURSOR EFFECTS — v4 (attraction + glow + sparks)
══════════════════════════════════════════════════ */
(function initCursor(){
  const dot=document.getElementById('cursor-dot');
  if(!dot)return;

  const SPARK_COLS=['#a78bfa','#67e8f9','#6ee7b7','#fbbf24','#f472b6','#c084fc','#38bdf8','#34d399'];
  const GLOW_COLS=[
    'rgba(167,139,250,.48)','rgba(103,232,249,.42)',
    'rgba(110,231,183,.38)','rgba(244,114,182,.42)','rgba(192,132,252,.44)'
  ];

  let mx=0,my=0,px=0,py=0;
  let lastGlow=0, lastSpark=0;

  function onMove(cx,cy){
    mx=cx; my=cy;
    dot.style.left=cx+'px'; dot.style.top=cy+'px'; dot.style.opacity='1';

    const dx=cx-px, dy=cy-py;
    const speed=Math.sqrt(dx*dx+dy*dy);
    px=cx; py=cy;

    const now=Date.now();

    /* Glow blobs — soft ambient, no lines */
    const gInt=speed>10?16:speed>4?26:40;
    if(now-lastGlow>gInt){
      lastGlow=now;
      spawnGlow(cx,cy,speed);
    }

    /* Sparks — only on movement, scale with speed */
    if(speed>5 && now-lastSpark>32){
      lastSpark=now;
      const cnt=speed>20?3:speed>10?2:1;
      for(let i=0;i<cnt;i++) spawnSpark(cx,cy,false,speed);
    }
  }

  document.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
  document.addEventListener('touchmove',e=>{
    const t=e.touches[0]; onMove(t.clientX,t.clientY);
  },{passive:true});
  document.addEventListener('mouseleave',()=>{ dot.style.opacity='0'; });
  document.addEventListener('mouseenter',()=>{ dot.style.opacity='1'; });

  /* Click / touch */
  function onPress(cx,cy){
    dot.style.width='10px'; dot.style.height='10px';
    spawnRipple(cx,cy);
    for(let i=0;i<16;i++) spawnSpark(cx,cy,true);
    /* burst glow */
    for(let i=0;i<4;i++) setTimeout(()=>spawnGlow(cx,cy,40,true),i*50);
  }
  function onRelease(){ dot.style.width='7px'; dot.style.height='7px'; }

  document.addEventListener('mousedown',e=>onPress(e.clientX,e.clientY));
  document.addEventListener('mouseup',onRelease);
  document.addEventListener('touchstart',e=>{const t=e.touches[0];onPress(t.clientX,t.clientY);},{passive:true});
  document.addEventListener('touchend',onRelease);

  /* ─── Particle factories ─── */

  function spawnGlow(x,y,speed,burst){
    const el=document.createElement('div');
    el.className='cur-glow';
    const sz=burst?(20+Math.random()*22):(7+speed*.5+Math.random()*7);
    const col=GLOW_COLS[Math.floor(Math.random()*GLOW_COLS.length)];
    const dur=(burst?.6:.38)+Math.random()*.22;
    /* tiny scatter so blobs don't overlap perfectly */
    const ox=(Math.random()-.5)*5, oy=(Math.random()-.5)*5;
    el.style.cssText=`left:${x+ox}px;top:${y+oy}px;width:${sz}px;height:${sz}px;background:${col};--gd:${dur}s;animation-duration:${dur}s`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),(dur+.06)*1000);
  }

  function spawnSpark(x,y,burst,baseSpeed=0){
    const el=document.createElement('div');
    el.className='cur-spark';
    const sz=(burst?3:1.5)+Math.random()*(burst?5.5:3.5);
    const angle=Math.random()*Math.PI*2;
    const dist=(burst?20:4)+Math.random()*(burst?34:14)+baseSpeed*.3;
    const dx=Math.cos(angle)*dist, dy=Math.sin(angle)*dist;
    const dur=(burst?.46:.28)+Math.random()*.28;
    const col=SPARK_COLS[Math.floor(Math.random()*SPARK_COLS.length)];
    const br=Math.random()>.4?'50%':'3px';
    el.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;background:${col};border-radius:${br};--dx:${dx}px;--dy:${dy}px;--dur:${dur}s;animation-duration:${dur}s;box-shadow:0 0 ${sz+2}px ${col}`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),(dur+.07)*1000);
  }

  function spawnRipple(x,y){
    const cols=['rgba(167,139,250,.8)','rgba(103,232,249,.7)','rgba(110,231,183,.6)'];
    [0,110,220].forEach((delay,ri)=>{
      setTimeout(()=>{
        const el=document.createElement('div');
        el.className='cur-ripple';
        const sz=14+ri*8;
        el.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;--rclr:${cols[ri]}`;
        document.body.appendChild(el);
        setTimeout(()=>el.remove(),900);
      },delay);
    });
  }
})();
</script>
